<style>
:root{
  --ink:#17262B;
  --ink-soft:#5A6B70;
  --paper:#FBFAF7;
  --chalk:#E2E5DE;
  --kobolt:#2F5C8A;
  --oker:#D8A22B;
  --rust:#AF4327;
  --line:rgba(23,38,43,.13);
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--chalk);
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;
  line-height:1.45;
  padding-bottom:88px;
}
#app{max-width:540px;margin:0 auto;padding:18px 16px 0}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
button{font-family:inherit;font-size:inherit;cursor:pointer}
a{color:var(--kobolt)}

.topbar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.wordmark{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:-.02em}
.whoami{font-size:12px;color:var(--ink-soft);background:none;border:0;padding:6px 0;text-decoration:underline;text-underline-offset:3px}

.sheet{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-soft);font-weight:600}

.bigdate{font-family:var(--display);font-size:25px;line-height:1.08;margin:6px 0 0;letter-spacing:-.02em}
.bigdate.none{font-size:19px;color:var(--ink-soft)}
.underline{display:block;width:100%;height:7px;margin:1px 0 7px;overflow:visible}
.countdown{font-size:13px;color:var(--ink-soft);margin-bottom:12px}

.btn{display:block;width:100%;min-height:50px;border-radius:12px;border:1px solid var(--ink);
  background:var(--ink);color:var(--paper);font-weight:600;padding:12px 16px;transition:transform .1s ease}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.warn{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.row{display:inline-flex;align-items:center;justify-content:center;width:auto;min-height:42px;padding:8px 14px;font-size:14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow.tight .btn.row{min-height:38px;padding:7px 12px;font-size:13px}
.sheet.slim{padding:15px 18px 16px}
.ico{width:15px;height:15px;flex:0 0 auto;margin-right:7px;fill:none;stroke:currentColor;

.weekhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weeknav{background:none;border:1px solid var(--line);border-radius:9px;width:34px;height:34px;color:var(--ink);font-size:16px;line-height:1}

.banner{border-radius:14px;padding:14px 16px;margin-bottom:14px;font-size:14px;

.day .dt{width:74px;flex:0 0 74px;font-size:13px;color:var(--ink-soft)}

.slots{flex:1;min-width:0}

.slot+.slot{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.slot.open .who{color:var(--rust)}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;border:1px solid var(--line);color:var(--ink-soft);white-space:nowrap}
.tag.you{background:var(--oker);border-color:var(--oker);color:#3A2A00}

label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}

/* hvem som går i dag, én blokk per plass */
.vakt{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.vakt:first-of-type{border-top:0}

.vakt.tom .nv{color:var(--rust)}

/* fasebryter, morgen og hjem */

.faser button[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* banebrikker */
.brikker{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.brikker button{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;

.brikker button[aria-pressed="true"]{background:var(--kobolt);border-color:var(--kobolt);color:#fff;font-weight:600}
.stort{font-family:var(--display);font-size:22px;line-height:1.15;margin:8px 0 2px;letter-spacing:-.01em}
.tall{display:flex;align-items:baseline;gap:11px;margin:8px 0 2px}
.tall b{font-family:var(--display);font-size:44px;line-height:.95;font-weight:600;letter-spacing:-.03em}
.tall span{font-size:15px;color:var(--ink-soft)}
.navnebrikker{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.navnebrikker button{background:#fff;border:1px solid var(--line);border-radius:20px;padding:8px 13px;
  font-size:15px;color:var(--ink);min-height:40px}
.navnebrikker button:active{background:var(--chalk)}

/* hentelista: én linje per barn, hele linja er trykkflaten */
.hentelinje{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;
  padding:9px 2px;border-top:1px solid var(--line);text-align:left;color:var(--ink);min-height:46px}
.hentelinje:first-of-type{border-top:0}
.boks{width:23px;height:23px;flex:0 0 23px;border:2px solid var(--ink-soft);border-radius:7px;position:relative}
.hentelinje.av .boks{background:var(--kobolt);border-color:var(--kobolt)}
.hentelinje.av .boks::after{content:"";position:absolute;left:6px;top:3px;width:7px;height:12px;
  border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(40deg)}
.hentelinje .bn{flex:1;min-width:0;font-size:16px;font-weight:600}
.hentelinje.av .bn{color:var(--ink-soft);font-weight:500}
.hentelinje .vk{font-size:12px;color:var(--ink-soft);white-space:nowrap}
.hentetall{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.hentetall.ferdig{color:var(--kobolt);font-weight:600}
.avmeldt{display:flex;gap:8px;align-items:baseline;padding:8px 2px;border-top:1px solid var(--line);
  font-size:14px;color:var(--ink-soft)}
.avmeldt b{font-weight:600;color:var(--ink)}
.dagslogg{font-size:12px;color:var(--ink-soft);padding:6px 0;border-top:1px solid var(--line)}
a.btn{text-decoration:none;display:inline-flex}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:11px 18px;border-radius:11px;font-size:14px;z-index:50;max-width:88%;text-align:center}
.center{text-align:center;color:var(--ink-soft);padding:26px 10px;font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--kobolt);outline-offset:2px}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.view{animation:fade .22s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"><div class="center">Laster planen</div></div>
<div class="tabs" id="tabs" hidden></div>
<script>
/* ====== PRODUKSJON: Supabase oppsett ======
   Fyll inn de to linjene under fra ditt Supabase prosjekt (Settings, API).
   Anon key er trygg å ha i klartekst her, den er laget for å ligge i frontend koden. */
/* Byggmerke. Endres ved hver deploy, og er det appen kjenner seg selv igjen på.
   Det må ligge i fila selv, ikke hentes, ellers kan en app som kjører fra cache
   tro at den er ny fordi serveren svarer nytt. */
const BYGG = "2026-08-21-4";

const SUPABASE_URL = "https://cdbazglchnghywskgiel.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkYmF6Z2xjaG5naHl3c2tnaWVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5OTA0MjMsImV4cCI6MjEwMjU2NjQyM30.0KUA4LWLbCV_IgcDfvnmXDuq28W3MEloEA-kQNOVfH0";

/* Er de to linjene over ikke fylt ut, blir ingenting lagret. Da sier appen fra,
   i stedet for å se tom ut hver gang den lastes. */
const CONFIG_OK = /^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(SUPABASE_URL)
  && SUPABASE_ANON_KEY.length > 40;
const feil = (melding, art) => Object.assign(new Error(melding), art);

let __storageReady = false;
(async()=>{
  const lokal = {
    get(key){
      const v = localStorage.getItem(key);
      if(v===null) throw feil("tom", {tom:true});
      return {key, value:v, shared:false};
    },
    set(key, value){ localStorage.setItem(key, value); return {key, value, shared:false}; },
    del(key){ localStorage.removeItem(key); return {key, deleted:true, shared:false}; }
  };
  if(!CONFIG_OK){
    console.error("Følgegruppa: SUPABASE_URL og SUPABASE_ANON_KEY er ikke fylt ut. Se README.");
    window.storage = {
      async get(key, shared){ if(shared) throw feil("mangler oppsett", {oppsett:true}); return lokal.get(key); },
      async set(key, value, shared){ if(shared) throw feil("mangler oppsett", {oppsett:true}); return lokal.set(key, value); },
      async delete(key, shared){ if(shared) throw feil("mangler oppsett", {oppsett:true}); return lokal.del(key); }
    };
    __storageReady = true;
    document.dispatchEvent(new Event("storageready"));
    return;
  }
  const {createClient} = await import("https://esm.sh/@supabase/supabase-js@2");
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  window.storage = {
    async get(key, shared){
      if(!shared) return lokal.get(key);
      const {data, error} = await supabase.from("app_kv").select("value").eq("key", key).maybeSingle();
      if(error) throw feil(error.message||"lesefeil", {nett:true});   // nede, eller blokkert av RLS
      if(!data) throw feil("tom", {tom:true});                        // finnes ikke ennå, det er greit
      return {key, value:data.value, shared:true};
    },
    async set(key, value, shared){
      if(!shared) return lokal.set(key, value);
      const {error} = await supabase.from("app_kv").upsert({key, value, updated_at:new Date().toISOString()});
      if(error) throw feil(error.message||"skrivefeil", {nett:true});
      return {key, value, shared:true};
    },
    async delete(key, shared){
      if(!shared) return lokal.del(key);
      const {error} = await supabase.from("app_kv").delete().eq("key", key);
      if(error) throw feil(error.message||"slettefeil", {nett:true});
      return {key, deleted:true, shared:true};
    }
  };
  supabase.channel("app_kv_changes")
    .on("postgres_changes", {event:"*", schema:"public", table:"app_kv"}, ()=>{
      if(typeof load==="function"&&typeof render==="function"){load().then(render);}
    }).subscribe();
  __storageReady = true;
  document.dispatchEvent(new Event("storageready"));
})();
</script>
<script>
/* ---------- lagring ---------- */
const KEY="folgegruppe_v1", MEKEY="folgegruppe_meg";
let DATA=null, ME=null, TAB="hjem", WEEKOFF=0, BUSY=false, HDAY=null;
let ADMIN=false, LOADERR=null, HFASE=null;
let MINVERSJON=null, NYVERSJON=false;

const blank=()=>({v:3,founderId:null,families:[],order:[],term:{start:"2026-08-17",end:"2026-12-18",meetTime:"08:15",
  perDay:2,reisetid:12,baneFra:"15:58",baneTil:"16:38",baneIntervall:8,
  skip:[{from:"2026-09-28",to:"2026-10-02",label:"Høstferie"}]},plan:{},dager:{},log:[]});

/* En dag hadde før én familie: {familyId, original}. Nå har den en plass per voksen som skal gå:
   {slots:[{familyId, original}, ...]}. Gamle dager løftes opp til én plass, og perDay som mangler
   betyr én, slik at gamle data oppfører seg som før til noen endrer innstillingen. */
function normaliser(s){
  const t=blank().term;
  if(!s.term)s.term=t;
  if(!s.term.perDay)s.term.perDay=1;
  ["reisetid","baneFra","baneTil","baneIntervall"].forEach(k=>{if(!s.term[k])s.term[k]=t[k];});
  Object.keys(s.plan||{}).forEach(dt=>{
    const p=s.plan[dt];if(!p)return;
    if(!Array.isArray(p.slots)){
      const en={familyId:p.familyId||null};
      if(p.original)en.original=p.original;
      s.plan[dt]={slots:[en]};
    }
  });
  /* Gamle checkins var ett flagg per barn per dag: "here" betydde hentet på skolen,
     "away" betydde ikke med i dag. Nå er morgen og ettermiddag to spørsmål. */
  delete s.term.stasjonFra; delete s.term.stasjonTil;   // ble bare brukt i en melding vi ikke har lenger
  s.dager=s.dager||{};
  if(s.checkins){
    Object.keys(s.checkins).forEach(dt=>{
      const gml=s.checkins[dt]||{};
      Object.keys(gml).forEach(kid=>{
        const d=s.dager[dt]=s.dager[dt]||{barn:{}};
        d.barn=d.barn||{};
        const b=d.barn[kid]=d.barn[kid]||{};
        if(gml[kid]==="here")b.pm="hentet";
        if(gml[kid]==="away"){b.am="ikke";b.pm="ikke";}
      });
    });
    delete s.checkins;
  }
  return s;
}

/* En tom base betyr "ingen har satt opp gruppa ennå". En feil betyr at vi ikke vet,
   og da viser vi aldri et tomt oppsett, og skriver aldri over det som ligger der. */
function feiltype(e){return e&&e.oppsett?"oppsett":"nett";}
async function load(){
  try{const r=await window.storage.get(KEY,true);DATA=normaliser(JSON.parse(r.value));LOADERR=null;}
  catch(e){
    if(e&&e.tom){DATA=blank();LOADERR=null;}
    else{DATA=DATA||blank();LOADERR=feiltype(e);}
  }
  try{const r=await window.storage.get(MEKEY,false);ME=JSON.parse(r.value).id;}
  catch(e){ME=null;}
}
async function save(){await window.storage.set(KEY,JSON.stringify(DATA),true);}
async function mutate(fn){
  if(BUSY)return; BUSY=true;
  let e2=null;
  try{
    try{const r=await window.storage.get(KEY,true);DATA=normaliser(JSON.parse(r.value));LOADERR=null;}
    catch(e){if(!e||!e.tom)throw e;}       // tom base er greit, alt annet stopper oss
    fn(DATA); await save();
  }catch(e){e2=e;LOADERR=feiltype(e);}
  BUSY=false; render();
  if(e2)toast(e2.oppsett?"Appen mangler databasekobling, ingenting ble lagret."
    :"Klarte ikke å lagre, ingenting er endret. Prøv igjen.");
}
async function setMe(id){ME=id;try{await window.storage.set(MEKEY,JSON.stringify({id}),false);}catch(e){}render();}

/* En app lagt på hjemskjermen gjenopptas fra minnet. Da hentes dataene på nytt, men
   koden er den som ble lastet første gang, kanskje uker siden. Vi følger derfor med på
   etag til selve siden, som Vercel bytter ved hver deploy, og sier fra i stedet for å
   laste om under føttene på noen. */
let SISTSJEKK=0;
async function sjekkVersjon(){
  if(NYVERSJON)return;
  const naa=Date.now();
  if(naa-SISTSJEKK<300000)return;          // ikke ved hvert eneste bytte mellom apper
  SISTSJEKK=naa;
  try{
    const r=await fetch(location.pathname,{cache:"no-store"});
    const txt=await r.text();
    const m=txt.match(/const BYGG = "([^"]+)"/);
    if(m&&m[1]!==BYGG){NYVERSJON=true;render();return;}   // sikreste signal: fila sier noe annet enn oss
    const ny=r.headers.get("etag")||r.headers.get("last-modified");
    if(!ny)return;
    if(!MINVERSJON)MINVERSJON=ny;                          // reserve, om byggmerket ikke er bumpet
    else if(ny!==MINVERSJON){NYVERSJON=true;render();}
  }catch(e){}
}

/* ---------- datoer ---------- */
const DAG=["søndag","mandag","tirsdag","onsdag","torsdag","fredag","lørdag"];
const DAGK=["søn","man","tir","ons","tor","fre","lør"];
const MND=["januar","februar","mars","april","mai","juni","juli","august","september","oktober","november","desember"];
const d=s=>new Date(s+"T00:00:00Z");
const iso=x=>x.toISOString().slice(0,10);
const add=(s,n)=>{const x=d(s);x.setUTCDate(x.getUTCDate()+n);return iso(x);};
const dow=s=>d(s).getUTCDay();
const today=()=>iso(new Date(Date.now()-new Date().getTimezoneOffset()*6e4));
const lang=s=>DAG[dow(s)]+" "+d(s).getUTCDate()+". "+MND[d(s).getUTCMonth()];
const kort=s=>d(s).getUTCDate()+"."+(d(s).getUTCMonth()+1)+".";
function uke(s){const x=d(s);x.setUTCDate(x.getUTCDate()+4-(x.getUTCDay()||7));
  return Math.ceil(((x-Date.UTC(x.getUTCFullYear(),0,1))/864e5+1)/7);}
function ferie(s){return (DATA.term.skip||[]).find(f=>s>=f.from&&s<=f.to);}
function skoledager(){const out=[];let s=DATA.term.start;
  if(!s||!DATA.term.end||s>DATA.term.end)return out;
  let guard=0;
  while(s<=DATA.term.end&&guard++<800){const w=dow(s);if(w>=1&&w<=5&&!ferie(s))out.push(s);s=add(s,1);}
  return out;}
function mandag(s){const w=dow(s)||7;return add(s,1-w);}

/* ---------- oppslag ---------- */
const fam=id=>DATA.families.find(f=>f.id===id);
function myFam(){return DATA.families.find(f=>f.members.some(m=>m.id===ME));}
/* En husstand heter det barnet den følger, ikke et etternavn. name er bare et ekko av barna. */
function husnavn(f){if(!f)return "";const k=(f.kids||[]).map(x=>x.name.trim()).filter(Boolean);
  return k.length?k.join(" og "):(f.name||"");}
function husnokkel(f){return husnavn(f).toLowerCase();}
/* uten founderId (gamle data) er alle administratorer, ellers bare den som satte opp gruppa */
function isFounder(){return !DATA.founderId||DATA.founderId===ME;}
function meName(){const f=myFam();if(!f)return null;const m=f.members.find(m=>m.id===ME);return m?m.name:null;}
const perDag=()=>Math.max(1,DATA.term.perDay||1);
function slot(dt){return DATA.plan[dt]||null;}
function plasser(dt){const p=slot(dt);return p&&p.slots?p.slots:[];}
function plassHus(dt){return plasser(dt).map(s=>s.familyId?fam(s.familyId):null);}
function voksne(f){return f?f.members.map(m=>m.name.split(" ")[0]).join(" / "):"";}
/* kort etikett for dagen: husstandene som går, skilt med pluss */
function navn(dt){const l=plassHus(dt).filter(Boolean).map(husnavn);return l.length?l.join(" + "):null;}
function isMine(dt){const f=myFam();return !!f&&plasser(dt).some(s=>s.familyId===f.id);}
function minPlass(dt){const f=myFam();if(!f)return -1;return plasser(dt).findIndex(s=>s.familyId===f.id);}
function ledige(dt){return plasser(dt).filter(s=>!s.familyId).length;}
function medMeg(dt){const f=myFam();return plassHus(dt).filter(x=>x&&(!f||x.id!==f.id));}
function openDays(){return skoledager().filter(dt=>dt>=today()&&ledige(dt)>0);}
function myNext(){return skoledager().find(dt=>dt>=today()&&isMine(dt))||null;}
const nid=p=>p+Math.random().toString(36).slice(2,8);
function phones(str){return (str||"").split(",").map(s=>s.trim()).filter(Boolean);}
function callBtns(str,cls){return phones(str).map(n=>'<a class="btn ghost row'+(cls?" "+cls:"")+'" href="tel:'+
  n.replace(/[^\d+]/g,"")+'">Ring '+esc(n)+"</a>").join("");}
function allKids(){return DATA.families.flatMap(f=>(f.kids||[]).map(k=>({id:k.id,name:k.name,familyId:f.id})));}
/* barna i alfabetisk rekkefølge, som er slik hentelista skal leses */
function alleBarn(){return allKids().sort((a,b)=>a.name.localeCompare(b.name,"nb"));}
function mineBarn(){const f=myFam();return f?(f.kids||[]).map(k=>({id:k.id,name:k.name,familyId:f.id})):[];}

/* ---------- hentemodus ---------- */
function dagPost(dt){return (DATA.dager&&DATA.dager[dt])||null;}
function barnStatus(dt,kid){const d=dagPost(dt);return (d&&d.barn&&d.barn[kid])||{};}
/* skriver i dagsposten uten å måtte gjenta oppsettet av tomme objekter */
function iDag(s,dt){s.dager=s.dager||{};s.dager[dt]=s.dager[dt]||{};const d=s.dager[dt];
  d.barn=d.barn||{};d.vakt=d.vakt||{};d.logg=d.logg||[];return d;}
function dagLogg(s,dt,tekst){const d=iDag(s,dt);d.logg.unshift({ts:Date.now(),tekst});
  if(d.logg.length>30)d.logg.length=30;}

/* voksen som faktisk går for en husstand i dag, hvis noen har sagt det er dem */
function vaktPerson(dt,husId){
  const f=fam(husId);
  if(!f)return null;
  const d=dagPost(dt), mid=d&&d.vakt?d.vakt[husId]:null;
  if(mid)return f.members.find(m=>m.id===mid)||null;
  /* Er det bare én voksen i husstanden, er det ingenting å si fra om. */
  return f.members.length===1?f.members[0]:null;
}
/* eget nummer om det finnes, ellers husstandens første */
function tlfFor(medlem,hus){
  const eget=phones(medlem&&medlem.phone).shift();
  return eget||phones(hus&&hus.phone).shift()||"";
}
function ringEn(navn,nr){
  if(!nr)return "";
  return '<a class="btn ghost row" href="tel:'+nr.replace(/[^\d+]/g,"")+'">Ring '+esc(navn||nr)+"</a>";
}
/* de på vakt i dag krysser hentelista og setter bane. Administrator er reserve. */
function kanKrysse(dt){return isMine(dt)||isFounder();}
function erMinBarn(kid){return mineBarn().some(k=>k.id===kid);}

const tilMin=t=>{const[h,m]=String(t||"0:0").split(":").map(Number);return (h||0)*60+(m||0);};
const fraMin=n=>pad2(Math.floor(((n%1440)+1440)%1440/60))+":"+pad2(((n%60)+60)%60);
function baneListe(){
  const t=DATA.term, fra=tilMin(t.baneFra||"15:58"), til=tilMin(t.baneTil||"16:38");
  const steg=Math.max(1,t.baneIntervall||8), ut=[];
  for(let m=fra;m<=til&&ut.length<12;m+=steg)ut.push(fraMin(m));
  return ut;
}
function ankomst(bane){
  if(!bane)return "";
  return fraMin(tilMin(bane)+(DATA.term.reisetid||0));
}
/* status for et barn i dag, brukt både i lista og i meldingen til gruppa */
function hentesIDag(dt){return alleBarn().filter(k=>barnStatus(dt,k.id).pm!=="ikke");}
/* Om morgenen er tallet det som betyr noe: hvor mange barn har du med deg.
   Det utledes, så ingen må krysse av noen. Bare avvikene trykkes. */
function medIDag(dt){return alleBarn().filter(k=>{const a=barnStatus(dt,k.id).am;
  return a!=="ikke"&&a!=="motteikke";});}
function ikkeMedIDag(dt){return alleBarn().filter(k=>{const a=barnStatus(dt,k.id).am;
  return a==="ikke"||a==="motteikke";});}
function avmeldtIDag(dt){return alleBarn().filter(k=>barnStatus(dt,k.id).pm==="ikke");}

/* ---------- kalender (ics) ---------- */
const pad2=n=>String(n).padStart(2,"0");
function icsEvent(dt,title,desc){
  const [hh,mm]=(DATA.term.meetTime||"08:15").split(":").map(Number);
  const start=d(dt);start.setUTCHours(hh,mm,0,0);
  const end=new Date(start.getTime()+30*60000);
  const f=x=>x.getUTCFullYear()+pad2(x.getUTCMonth()+1)+pad2(x.getUTCDate())+"T"+pad2(x.getUTCHours())+pad2(x.getUTCMinutes())+"00";
  return ["BEGIN:VEVENT","UID:"+dt+"-"+nid("e")+"@folgegruppa","DTSTART:"+f(start),"DTEND:"+f(end),
    "SUMMARY:"+title,"DESCRIPTION:"+(desc||""),"BEGIN:VALARM","TRIGGER:-PT15M","ACTION:DISPLAY",
    "DESCRIPTION:Påminnelse","END:VALARM","END:VEVENT"].join("\r\n");
}
function icsMed(dt){
  const andre=medMeg(dt);
  return (andre.length?"Sammen med "+andre.map(x=>husnavn(x)+" ("+voksne(x)+")").join(" og ")+". ":"")+
    (ledige(dt)?"Én plass står ledig. ":"")+"Husk å levere barna ved Steinerskolen.";
}
function downloadICS(filename,events){
  const body=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Følgegruppa//NO","CALSCALE:GREGORIAN",
    events.join("\r\n"),"END:VCALENDAR"].join("\r\n");
  const blob=new Blob([body],{type:"text/calendar"}), url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);
}

/* ---------- planlegging ---------- */
/* Å ha vakt betyr sen jobbstart og tidlig avreise. Det må planlegges, så en endring i
   hvem som er med skal ikke røre de nærmeste dagene. Nye husstander, og husstander som
   melder seg av, virker fra mandagen minst to uker frem. */
const LEDETID=14;
function ledeDato(){
  const d=add(today(),LEDETID);
  return dow(d)===1?d:add(mandag(d),7);   // første mandag minst to uker frem, aldri før
}
function applyFuture(state,reshuffle,fra){
  const activeIds=state.families.filter(f=>f.active!==false).map(f=>f.id);
  if(!activeIds.length)return;
  let order;
  if(reshuffle||!state.order||!state.order.length){
    order=activeIds.slice();
    for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  }else{
    order=state.order.filter(id=>activeIds.includes(id));
    activeIds.forEach(id=>{if(!order.includes(id))order.push(id);});
  }
  state.order=order;
  state.planSatt=Date.now();          // synlig i Fordeling, så en omfordeling ikke skjer i det stille
  const n=Math.max(1,state.term.perDay||1);
  const days=skoledager().filter(dt=>dt>=(fra||today()));
  let c=0;
  days.forEach(dt=>{
    const slots=[], brukt={};
    for(let j=0;j<n;j++){
      let valgt=null;
      for(let k=0;k<order.length;k++){                     // aldri samme husstand to ganger samme dag
        const id=order[(c+k)%order.length];
        if(!brukt[id]){valgt=id;c=(c+k+1)%order.length;break;}
      }
      if(valgt)brukt[valgt]=1;                             // er det færre husstander enn plasser, står resten ledig
      slots.push({familyId:valgt||null});
    }
    state.plan[dt]={slots};
  });
}
function generer(state){
  applyFuture(state,true);
  state.log.unshift({ts:Date.now(),text:"Planen ble satt opp på nytt fra i dag"});
}
function regenFuture(state,note,fra){
  applyFuture(state,false,fra);
  if(note)state.log.unshift({ts:Date.now(),text:note});
}

/* ---------- ui ---------- */
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;
  document.body.appendChild(el);setTimeout(()=>el.remove(),2600);}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* lite kalenderikon til knappene som lager .ics */
const kalIkon='<svg class="ico" viewBox="0 0 16 16" aria-hidden="true" focusable="false">'+
  '<rect x="2.2" y="3.6" width="11.6" height="10.6" rx="2.4"/>'+
  '<path d="M2.2 7.1h11.6M5.6 2v3.1M10.4 2v3.1"/></svg>';

function wobble(w){ // hånd tegnet strek
  let p="M 2 6";for(let x=2;x<=w;x+=Math.max(10,w/14)){p+=" Q "+(x+6)+" "+(6+(x/14%2<1?-4:4))+" "+(x+12)+" 6";}
  return '<svg class="underline" viewBox="0 0 '+(w+14)+' 12" preserveAspectRatio="none" aria-hidden="true"><path d="'+p+
    '" fill="none" stroke="var(--oker)" stroke-width="3" stroke-linecap="round"/></svg>';}

/* kompakte ringeknapper med fornavn i stedet for nummer */
function ringKort(f){
  if(!f)return "";
  const egne=(f.members||[]).filter(m=>phones(m.phone).length);
  if(egne.length)return egne.map(m=>ringEn(m.name.split(" ")[0],tlfFor(m,null))).join("");
  return phones(f.phone).map((n,i)=>{
    const m=(f.members||[])[i]||(f.members||[])[0];
    return ringEn(m?m.name.split(" ")[0]:n,n);
  }).join("");
}

/* Dagene uke for uke. fra=null gir hele terminen, maksUker kutter etter et helt antall uker.
   Returnerer html og hvor mange dager som ikke ble vist, så forsiden kan si det. */
function dagListe(fra,maksUker){
  let alle=[];let s=DATA.term.start,guard=0;
  while(s<=DATA.term.end&&guard++<800){
    const wd=dow(s);
    if(wd>=1&&wd<=5&&(!fra||s>=fra))alle.push(s);
    s=add(s,1);
  }
  let igjen=0;
  if(maksUker&&alle.length){
    const grense=add(mandag(alle[0]),maksUker*7);
    const i=alle.findIndex(dt=>dt>=grense);
    if(i>0){igjen=alle.slice(i).filter(dt=>!ferie(dt)).length;alle=alle.slice(0,i);}   // ferie er ikke en dag
  }
  if(!alle.length)return {html:'<div class="center">Ingen dager i planen.</div>',igjen:0};
  let h="",w=null,first=true;
  const naaMandag=mandag(today());
  alle.forEach(dt=>{
    const u=uke(dt);
    if(u!==w){
      w=u;
      const man=mandag(dt), naa=man===naaMandag;
      h+='<div class="weeklabel'+(naa?" na":"")+'"'+(first?' style="margin-top:8px"':"")+">"+
        "<b>Uke "+u+"</b><span>"+kort(man)+"–"+kort(add(man,4))+(naa?" · denne uka":"")+"</span></div>";
      first=false;
    }
    h+=dayRow(dt);
  });
  return {html:h,igjen:igjen};
}

function dayRow(dt,ctx){
  const f=ferie(dt);
  if(f)return '<div class="holiday">'+esc(f.label)+", "+kort(dt)+"</div>";
  const ps=plasser(dt);
  if(!ps.length)return "";
  const past=dt<today(), minF=myFam();
  const linjer=ps.map((sl,i)=>{
    const family=sl.familyId?fam(sl.familyId):null;
    const mine=!!(minF&&family&&family.id===minF.id);
    let tag="";
    if(!family)tag='<span class="tag open">mangler</span>';
    else if(mine)tag='<span class="tag you">deg</span>';
    else if(sl.original&&sl.original!==family.id)tag='<span class="tag">byttet</span>';
    let act="";
    if(!past&&ctx!=="flat"){
      if(!family)act='<button class="btn ghost row" data-act="take" data-d="'+dt+'" data-i="'+i+'">Jeg tar den</button>';
      else if(mine)act='<button class="btn ghost row" data-act="drop" data-d="'+dt+'" data-i="'+i+'">Vil bytte</button>';
    }
    const who=family
      ? esc(husnavn(family))+'<small>'+esc(voksne(family))+
        (sl.original&&sl.original!==family.id&&fam(sl.original)?" dekker for "+esc(husnavn(fam(sl.original))):"")+"</small>"
      : "Mangler en voksen"+(sl.original&&fam(sl.original)
          ?'<small>'+esc(husnavn(fam(sl.original)))+" vil bytte</small>":"");
    const naer=dt<=add(today(),1);            // ringeknapp bare når det er nå det gjelder
    const call=(!past&&naer&&!mine&&family&&ctx!=="flat")?ringKort(family):"";
    return '<div class="slot'+(family?"":" open")+'"><div class="who">'+who+"</div>"+tag+call+act+"</div>";
  }).join("");
  return '<div class="day'+(isMine(dt)?" mine":"")+(ledige(dt)?" open":"")+'" style="'+(past?"opacity:.45":"")+'">'+
    '<div class="dt"><b>'+esc(DAGK[dow(dt)])+" "+d(dt).getUTCDate()+'.</b>'+MND[d(dt).getUTCMonth()].slice(0,3)+'</div>'+
    '<div class="slots">'+linjer+"</div></div>";
}

/* ---------- skjermer ---------- */
function viewHjem(){
  const nx=myNext(), open=openDays(), f=myFam();
  let h='<div class="view">';
  if(open.length){
    const mangler=open.reduce((n,dt)=>n+ledige(dt),0);
    h+='<div class="banner"><strong>'+mangler+" ledig"+(mangler===1?" plass":"e plasser")+" på "+
      open.length+(open.length===1?" dag":" dager")+'.</strong> Trykk «Jeg tar den» på en dag du kan.</div>';
  }
  const iD=today(), dP=dagPost(iD), harVakt=isMine(iD), skoledag=plasser(iD).length>0;
  if(skoledag&&dP&&dP.bane&&!harVakt){
    h+='<div class="banner" style="background:#E7EDF4;border-color:rgba(47,92,138,.3);color:#1E3F5E">'+
      '<strong>Barna kommer med banen '+esc(dP.bane)+', hjemme '+esc(ankomst(dP.bane))+'.</strong> '+
      '<button class="btn ghost row" style="margin-top:10px" data-act="tab" data-t="henting">Se hentelista</button></div>';
  }
  if(skoledag&&harVakt){
    const kryss=hentesIDag(iD).filter(k=>barnStatus(iD,k.id).pm==="hentet").length;
    h+='<div class="banner" style="background:rgba(216,162,43,.16);border-color:rgba(216,162,43,.5);color:#5A4300">'+
      '<strong>Du har vakt i dag.</strong> '+(dP&&dP.bane?"Banen er satt til "+esc(dP.bane)+".":"Husk å sette banetid når du vet den.")+
      (kryss?" "+kryss+" barn er krysset av.":"")+
      '<button class="btn ghost row" style="margin-top:10px" data-act="tab" data-t="henting">Åpne hentemodus</button></div>';
  }
  const mineMeldt=mineBarn().filter(k=>{const st=barnStatus(iD,k.id);return st.am==="ikke"||st.pm==="ikke";});
  if(skoledag&&mineMeldt.length){
    h+='<div class="banner" style="background:var(--paper);border-color:var(--line);color:var(--ink-soft)">'+
      esc(mineMeldt.map(k=>k.name).join(" og "))+(mineMeldt.length===1?" er":" er")+
      ' meldt av i dag. <button class="btn ghost row" style="margin-top:10px" data-act="tab" data-t="henting">Endre</button></div>';
  }
  h+='<div class="sheet slim"><div class="eyebrow">Din neste dag</div>';
  if(nx){
    const dif=Math.round((d(nx)-d(today()))/864e5), med=medMeg(nx), led=ledige(nx);
    h+='<div class="bigdate">'+lang(nx)+"</div>"+wobble(220)+
      '<div class="countdown">'+(dif===0?"I dag":dif===1?"I morgen":"Om "+dif+" dager")+", uke "+uke(nx)+
      (med.length?" · sammen med "+esc(med.map(husnavn).join(" og "))+" ("+esc(med.map(voksne).join(", "))+")":"")+
      (led?' · <span style="color:var(--rust)">'+led+" plass"+(led===1?"":"er")+" ledig</span>":"")+"</div>"+
      (f&&f.members.length>1&&(!vaktPerson(nx,f.id)||vaktPerson(nx,f.id).id!==ME)
        ? '<p class="hint" style="margin:0 0 10px">'+
          (vaktPerson(nx,f.id)?esc(vaktPerson(nx,f.id).name.split(" ")[0])+" står som den som går."
            :"Ingen i husstanden har sagt hvem som går.")+
          ' <button class="btn ghost row" style="margin-top:8px" data-act="detErMeg" data-d="'+nx+
          '" data-h="'+f.id+'">Det er meg som går</button></p>':"")+
      '<div class="btnrow tight"><button class="btn warn row" data-act="drop" data-d="'+nx+
      '" data-i="'+minPlass(nx)+'">Vil bytte</button>'+
      '<button class="btn ghost row" data-act="ics" data-d="'+nx+'">'+kalIkon+'Legg i kalender</button>'+
      med.map(ringKort).join("")+"</div>";
  }else{
    h+='<div class="bigdate none">Ingen dager igjen på deg</div>'+
      '<div class="countdown" style="margin-bottom:0">Du står ikke oppført på flere dager denne terminen.</div>';
  }
  h+="</div>";
  const liste=dagListe(today(),3);
  h+='<div class="sheet"><div class="eyebrow">Dagene fremover</div>'+liste.html+
    (liste.igjen?'<p class="hint" style="margin:14px 0 0">Så følger '+liste.igjen+
      ' dager til, ut terminen.</p>':"")+
    '<button class="btn ghost" style="margin-top:12px" data-act="tab" data-t="kalender">'+kalIkon+
    'Hele terminen</button></div>';
  return h+"</div>";
}

/* Fase: om morgenen handler alt om beskjeder, om ettermiddagen om hentelista.
   For i dag velges fasen av klokka, ellers viser vi hjem, som er den viktige. */
function fase(dt){
  if(HFASE)return HFASE;
  if(dt!==today())return "hjem";
  return new Date().getHours()<12?"morgen":"hjem";
}

function blokkVakt(dt){
  const ps=plasser(dt);
  if(!ps.length)return '<p class="hint" style="margin:10px 0 0">Ingen er satt opp denne dagen.</p>';
  const minF=myFam();
  return ps.map((sl,i)=>{
    if(!sl.familyId){
      return '<div class="vakt tom"><div class="nv">Mangler en voksen'+
        (sl.original&&fam(sl.original)?'<small>'+esc(husnavn(fam(sl.original)))+" vil bytte</small>":"")+"</div>"+
        (dt>=today()?'<button class="btn ghost row" data-act="take" data-d="'+dt+'" data-i="'+i+'">Jeg tar den</button>':"")+
        "</div>";
    }
    const hus=fam(sl.familyId), person=vaktPerson(dt,sl.familyId);
    const minHus=!!(minF&&hus&&minF.id===hus.id);
    if(person){
      return '<div class="vakt"><div class="nv">'+esc(person.name.split(" ")[0])+
        '<small>følger '+esc(husnavn(hus))+"</small></div>"+
        (person.id===ME?'<span class="tag you">det er deg</span>':ringEn(person.name.split(" ")[0],tlfFor(person,hus)))+
        (minHus&&person.id!==ME&&dt>=today()
          ? '<button class="btn ghost row" data-act="detErMeg" data-d="'+dt+'" data-h="'+hus.id+'">Det er meg</button>':"")+
        "</div>";
    }
    return '<div class="vakt"><div class="nv">'+esc(husnavn(hus))+
      '<small>'+esc(voksne(hus))+", ikke sagt hvem som går</small></div>"+
      (minHus&&dt>=today()
        ? '<button class="btn ghost row" data-act="detErMeg" data-d="'+dt+'" data-h="'+hus.id+'">Det er meg</button>'
        : ringKort(hus))+"</div>";
  }).join("");
}

/* Ett kort per eget barn: her gir foreldre de tre beskjedene som faktisk oppstår. */
function kortMineBarn(dt,fs){
  const barna=mineBarn();
  if(!barna.length)return "";
  const fortid=dt<today();
  let h='<div class="sheet"><div class="eyebrow">Dine barn i dag</div>'+
    '<p class="hint" style="margin:8px 0 4px">Si fra her, så ser de på vakt det med én gang. '+

        '<button class="btn ghost row" data-act="meldav" data-d="'+dt+'" data-k="'+k.id+'" data-felt="pm">'+
        (st.pm==="ikke"?"Skal hentes likevel":"Skal ikke hentes")+"</button>"+
        (st.am==="ikke"&&st.pm==="ikke"?"":
          '<button class="btn ghost row" data-act="meldav" data-d="'+dt+'" data-k="'+k.id+'" data-felt="begge">Borte hele dagen</button>')+
        "</div>"+
        '<label for="notat-'+k.id+'" style="font-size:12px;margin:12px 0 5px">Beskjed til de som henter (valgfritt)</label>'+
        '<input id="notat-'+k.id+'" value="'+esc(st.notat||"")+'" placeholder="farmor henter i dag">'+

function fasenMorgen(dt){
  const t=DATA.term.meetTime||"08:15", kryss=kanKrysse(dt);
  const med=medIDag(dt), utenfor=ikkeMedIDag(dt);
  /* Tallet først. Det er det man trenger å vite når man står på perrongen. */
  let h='<div class="sheet"><div class="eyebrow">Om morgenen</div>'+
    '<div class="tall"><b>'+med.length+"</b><span>barn "+(kryss?"med deg":"med gruppa")+
    (dt===today()?" i dag":"")+"</span></div>";
  if(utenfor.length){
    h+='<p style="margin:10px 0 0;font-size:14px">Ikke med: '+utenfor.map(k=>{
      const st=barnStatus(dt,k.id);
      return "<strong>"+esc(k.name)+"</strong>"+
        (st.am==="motteikke"?" (møtte ikke)":"")+(st.notat?" ("+esc(st.notat)+")":"");
    }).join(", ")+".</p>";
  }else{
    h+='<p class="hint" style="margin:10px 0 0">Alle barna er med som vanlig.</p>';
  }
  h+='<p class="hint" style="margin:10px 0 0">Perrongen '+esc(t);
  if(dt===today()){
    const naa=new Date(), min=tilMin(t)-(naa.getHours()*60+naa.getMinutes());
    h+=min>0?", om "+min+" minutt"+(min===1?"":"er"):min>-90?", gruppa har dratt":"";
  }
  h+=". Kommer du for sent, leverer du selv.</p>";
  if(kryss&&dt>=today()&&med.length){
    h+='<p class="hint" style="margin:16px 0 0">Møtte noen ikke opp? Trykk navnet, så går tallet ned.</p>'+
      '<div class="navnebrikker">'+med.map(k=>'<button data-act="motteikke" data-d="'+dt+
      '" data-k="'+k.id+'">'+esc(k.name)+"</button>").join("")+"</div>";
  }
  if(kryss&&utenfor.some(k=>barnStatus(dt,k.id).am==="motteikke")){
    h+='<div class="navnebrikker" style="margin-top:12px">'+utenfor
      .filter(k=>barnStatus(dt,k.id).am==="motteikke")
      .map(k=>'<button data-act="motteikke" data-d="'+dt+'" data-k="'+k.id+
        '">'+esc(k.name)+" kom likevel</button>").join("")+"</div>";
  }
  h+="</div>";
  h+=kortMineBarn(dt,"morgen");
  return h;
}

function fasenHjem(dt){
  const d=dagPost(dt), bane=d&&d.bane, kryss=kanKrysse(dt), t=DATA.term;
  let h='<div class="sheet"><div class="eyebrow">Banen hjem</div>';
  if(bane){
    h+='<div class="stort">Banen '+esc(bane)+"</div>"+
      '<p style="margin:2px 0 0;font-size:14px">Hjemme på perrongen '+esc(ankomst(bane))+".</p>";
  }else{
    h+='<div class="stort" style="color:var(--ink-soft)">Banetid ikke satt ennå</div>'+
      '<p class="hint" style="margin:2px 0 0">De på vakt setter den når de vet hvilken bane de tar.</p>';
  }
  if(kryss&&dt>=today()){
    h+='<div class="brikker">'+baneListe().map(x=>'<button data-act="bane" data-d="'+dt+'" data-t="'+x+
      '" aria-pressed="'+(bane===x)+'">'+x+"</button>").join("")+"</div>"+
      (bane?'<button class="btn ghost row" style="margin-top:10px" data-act="bane" data-d="'+dt+'" data-t="">Fjern banetid</button>':"");
  }
  h+="</div>";

  const skal=hentesIDag(dt), avm=avmeldtIDag(dt);
  const krysset=skal.filter(k=>barnStatus(dt,k.id).pm==="hentet").length;
  h+='<div class="sheet"><div class="weekhead" style="margin-bottom:6px">'+
    '<div class="eyebrow">Henteliste</div><div class="hentetall'+
    (skal.length&&krysset===skal.length?" ferdig":"")+'">'+krysset+" av "+skal.length+"</div></div>";
  if(!skal.length&&!avm.length)h+='<p class="hint" style="margin:8px 0 0">Ingen barn er registrert. Legg dem inn under Innstillinger, Din familie.</p>';
  skal.forEach(k=>{
    const st=barnStatus(dt,k.id), av=st.pm==="hentet", hus=fam(k.familyId);
    const person=vaktPerson(dt,k.familyId);
    const hoyre=st.am==="motteikke"?'<span class="tag open">møtte ikke</span>':
      st.am==="ikke"?'<span class="tag open">kom selv</span>':
      '<span class="vk">'+esc(person?person.name.split(" ")[0]:voksne(hus))+"</span>";
    const inner='<span class="boks"></span><span class="bn">'+esc(k.name)+"</span>"+hoyre+
      (st.notat?'<span class="tag">beskjed</span>':"");
    h+=kryss&&dt>=today()
      ? '<button class="hentelinje'+(av?" av":"")+'" data-act="pm" data-d="'+dt+'" data-k="'+k.id+
        '" aria-pressed="'+av+'">'+inner+"</button>"
      : '<div class="hentelinje'+(av?" av":"")+'">'+inner+"</div>";
    if(st.notat)h+='<div class="avmeldt" style="border-top:0;padding-top:0"><span>'+esc(st.notat)+"</span></div>";
  });
  if(avm.length){
    h+='<div class="weeklabel" style="margin:16px 0 2px"><b style="background:var(--ink-soft)">Ikke med</b></div>';
    avm.forEach(k=>{const st=barnStatus(dt,k.id);
      h+='<div class="avmeldt"><b>'+esc(k.name)+"</b><span>skal ikke hentes"+
        (st.notat?" · "+esc(st.notat):"")+"</span></div>";});
  }
  if(!kryss)h+='<p class="hint" style="margin:14px 0 0">Det er de to på vakt som krysser av her.</p>';
  h+="</div>";
  if(d&&d.logg&&d.logg.length){
    h+='<div class="sheet"><div class="eyebrow">I dag</div>';
    d.logg.slice(0,8).forEach(l=>{h+='<div class="dagslogg">'+esc(l.tekst)+" · "+
      new Date(l.ts).toLocaleTimeString("nb-NO",{hour:"2-digit",minute:"2-digit"})+"</div>";});
    h+="</div>";
  }
  return h;
}

function viewHenting(){
  if(!HDAY)HDAY=today();
  const dt=HDAY, f=ferie(dt), wd=dow(dt);
  const utenfor=dt<DATA.term.start||dt>DATA.term.end;
  let h='<div class="view"><div class="sheet"><div class="weekhead">'+
    '<button class="weeknav" data-act="hday" data-v="-1" aria-label="Forrige dag">&#8249;</button>'+
    '<div class="eyebrow">'+esc(lang(dt))+(dt===today()?" · i dag":"")+'</div>'+
    '<button class="weeknav" data-act="hday" data-v="1" aria-label="Neste dag">&#8250;</button></div>';
  if(wd===0||wd===6||f||utenfor){
    h+='<p class="center">'+(f?esc(f.label):"Ingen følgegruppe denne dagen")+"</p></div></div>";
    return h;
  }
  h+='<div style="margin-top:10px">'+blokkVakt(dt)+"</div></div>";
  const fs=fase(dt);
  h+='<div class="faser">'+
    '<button data-act="hfase" data-f="morgen" aria-current="'+(fs==="morgen")+'">Morgen</button>'+
    '<button data-act="hfase" data-f="hjem" aria-current="'+(fs==="hjem")+'">Hjem</button></div>';
  h+=fs==="morgen"?fasenMorgen(dt):fasenHjem(dt);
  return h+"</div>";
}

function viewFordeling(){
  const days=skoledager();
  const rows=DATA.families.map(f=>{
    let n=0,dropped=0,cover=0;
    days.forEach(dt=>{plasser(dt).forEach(sl=>{
      if(sl.familyId===f.id){n++;if(sl.original&&sl.original!==f.id)cover++;}
      if(sl.original===f.id&&sl.familyId!==f.id)dropped++;});});
    return {f,n,dropped,cover};
  }).sort((a,b)=>b.n-a.n);
  const max=Math.max(1,...rows.map(r=>r.n));
  const mineF=myFam();
  let h='<div class="view"><div class="sheet"><div class="eyebrow">Dager per familie</div>'+
    '<p class="hint" style="margin:8px 0 16px">Teller hele terminen, etter bytter.'+
    (DATA.planSatt?" Dagene ble sist fordelt "+new Date(DATA.planSatt).toLocaleDateString("nb-NO",
      {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})+".":"")+'</p><table><thead><tr>'+
    '<th>Familie</th><th class="num">Dager</th><th class="num">Avmeldt</th><th class="num">Tatt for andre</th></tr></thead><tbody>';
  rows.forEach(r=>{h+='<tr><td>'+esc(husnavn(r.f))+(mineF&&mineF.id===r.f.id?" (din)":"")+(r.f.active===false?" (ikke med nå)":"")+
    '<div class="bar" style="width:'+Math.round(r.n/max*100)+'%;margin-top:6px"></div></td>'+
    '<td class="num">'+r.n+'</td><td class="num">'+r.dropped+'</td><td class="num">'+r.cover+"</td></tr>";});
  h+="</tbody></table>";
  if(!rows.length)h+='<div class="center">Ingen familier lagt inn ennå.</div>';
  h+="</div>";
  const withPhone=DATA.families.filter(f=>phones(f.phone).length);
  if(withPhone.length){
    h+='<div class="sheet"><div class="eyebrow">Kontakter</div>';
    withPhone.forEach(f=>{h+='<div class="day"><div class="who">'+esc(husnavn(f))+
      '<small>'+esc(f.members.map(m=>m.name).join(" og "))+'</small></div>'+callBtns(f.phone)+"</div>";});
    h+="</div>";
  }
  if(DATA.log&&DATA.log.length){
    h+='<div class="sheet"><div class="eyebrow">Siste endringer</div>';
    DATA.log.slice(0,12).forEach(l=>{h+='<div class="day"><div class="who" style="font-size:14px">'+esc(l.text)+
      '<small>'+new Date(l.ts).toLocaleDateString("nb-NO",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})+"</small></div></div>";});
    h+="</div>";
  }
  return h+"</div>";
}

/* ---------- handlinger ---------- */
/* En linje er "barn: voksne". Flere barn i samme husstand skilles med komma eller "og". */
function parseHus(txt){
  return (txt||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    const i=l.indexOf(":");
    const venstre=i>0?l.slice(0,i):l, hoyre=i>0?l.slice(i+1):"";
    const barn=venstre.split(/,| og /).map(s=>s.trim()).filter(Boolean);
    const voksne=hoyre.split(/,| og /).map(s=>s.trim()).filter(Boolean);
    if(!barn.length)return null;
    return {barn:barn.map(n=>({id:nid("k"),name:n})),
      voksne:(voksne.length?voksne:barn).map(n=>({id:nid("m"),name:n}))};
  }).filter(Boolean);
}
function parseSkip(txt){
  return (txt||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    const m=l.match(/(\d{4}-\d{2}-\d{2})\s*(?:til|-|–)\s*(\d{4}-\d{2}-\d{2})\s*:?\s*(.*)/);
    return m?{from:m[1],to:m[2],label:m[3]||"Fri"}:null;}).filter(Boolean);
}
function parseKids(txt,prev){
  const prevKids=prev||[];
  return (txt||"").split(",").map(s=>s.trim()).filter(Boolean).map(n=>{
    const ex=prevKids.find(k=>k.name.trim().toLowerCase()===n.toLowerCase());
    return ex?{...ex,name:n}:{id:nid("k"),name:n};
  });
}
function ukeTekst(){
  const start=add(mandag(today()),WEEKOFF*7);
  let out="Følgegruppa, uke "+uke(start)+":\n";
  for(let i=0;i<5;i++){const dt=add(start,i),f=ferie(dt),p=slot(dt);
    if(f){out+=DAGK[dow(dt)]+" "+kort(dt)+" "+f.label+"\n";continue;}
    const ps=plasser(dt);
    if(!ps.length)continue;
    const hus=plassHus(dt).filter(Boolean).map(x=>husnavn(x)+" ("+voksne(x)+")");
    const led=ledige(dt);
    out+=DAGK[dow(dt)]+" "+kort(dt)+" "+(hus.length?hus.join(" + "):"")+
      (led?(hus.length?" + ":"")+"MANGLER "+led+" VOKSEN":"")+"\n";}
  return out.includes("\n",out.indexOf("\n")+1)?out:out+"Ingen skoledager denne uka.\n";
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act;
  if(a==="tab"){TAB=b.dataset.t;WEEKOFF=0;render();window.scrollTo(0,0);return;}
  if(a==="week"){WEEKOFF+=+b.dataset.v;render();return;}
  if(a==="me"){setMe(b.dataset.id);TAB="hjem";return;}
  if(a==="switch"){ME=null;TAB="innst";try{await window.storage.delete(MEKEY,false);}catch(err){}
    render();window.scrollTo(0,0);return;}
  if(a==="showadmin"){ADMIN=true;render();window.scrollTo(0,0);return;}
  if(a==="claim"){
    if(!ME)return;
    const nm=meName();
    await mutate(s=>{if(s.founderId)return;s.founderId=ME;s.log.unshift({ts:Date.now(),text:nm+" ble administrator"});});
    toast(DATA.founderId===ME?"Du er administrator n\u00e5":"Noen andre tok rollen f\u00f8rst");return;}
  if(a==="copylink"){
    try{await navigator.clipboard.writeText(location.href);toast("Lenken er kopiert");}
    catch(err){toast(location.href);}return;}
  if(a==="oppdater"){location.reload();return;}
  if(a==="reload"){await load();render();sjekkVersjon();toast("Oppdatert");return;}
  if(a==="copy"){try{await navigator.clipboard.writeText(ukeTekst());toast("Ukeplanen er kopiert");}
    catch(err){toast(ukeTekst());}return;}
  if(a==="savefams"){
    const list=parseHus(document.getElementById("fams").value);
    if(!list.length){toast("Skriv inn minst \u00e9n linje");return;}
    const fresh=!DATA.families.length;
    const keepMe=ME;
    let nye=0;
    await mutate(s=>{
      const finn={};s.families.forEach(f=>{finn[husnokkel(f)]=f;});
      list.forEach(nf=>{
        const prev=finn[nf.barn.map(k=>k.name).join(" og ").toLowerCase()];
        if(prev){
          prev.kids=nf.barn.map(k=>{
            const pk=(prev.kids||[]).find(x=>x.name.trim().toLowerCase()===k.name.toLowerCase());
            return pk?{...pk,name:k.name}:k;
          });
          prev.name=husnavn(prev);
          prev.members=nf.voksne.map(m=>{
            const pm=(prev.members||[]).find(x=>x.name.trim().toLowerCase()===m.name.trim().toLowerCase());
            return pm?{...pm,name:m.name}:m;
          });
        }else{
          s.families.push({id:nid("f"),name:nf.barn.map(k=>k.name).join(" og "),active:true,
            phone:"",kids:nf.barn,members:nf.voksne});
          nye++;
        }
      });
      /* Retting av navn skal ikke røre planen. Bare nye husstander må inn i rulleringen. */
      if(fresh)generer(s);
      else if(nye)regenFuture(s,nye+(nye===1?" ny husstand":" nye husstander")+
        " er med i rulleringen fra "+kort(ledeDato()),ledeDato());
      else s.log.unshift({ts:Date.now(),text:"Lista ble oppdatert, dagene står som de var"});
    });
    if(keepMe&&!DATA.families.some(f=>f.members.some(m=>m.id===keepMe)))setMe(null);
    toast(fresh?"Klar. Velg hvem du er."
      :nye?"Lagt til, og med fra "+kort(ledeDato())+". De neste ukene er urørt."
      :"Oppdatert. Ingen ble fjernet, og dagene står som de var.");return;}
  if(a==="joinnew"){
    const g=id=>{const el=document.getElementById(id);return el?el.value.trim():"";};
    const myName=g("newmyname"), partner=g("newpartner"), phone=g("newphone");
    const barn=parseKids(g("newkids"));
    if(!barn.length||!myName){toast("Fyll inn barnets fornavn og ditt fornavn");return;}
    const nokkel=barn.map(k=>k.name).join(" og ").toLowerCase();
    const finnes=DATA.families.find(f=>husnokkel(f)===nokkel);
    let newId, forst=false, blePart=false;
    await mutate(s=>{
      newId=nid("m");
      const meg={id:newId,name:myName};
      const eks=s.families.find(f=>husnokkel(f)===nokkel);
      if(eks){                                  // barnet st\u00e5r der alt, da er du en voksen til i den husstanden
        blePart=true;
        if(!eks.members.some(m=>m.name.trim().toLowerCase()===myName.toLowerCase()))eks.members.push(meg);
        else newId=eks.members.find(m=>m.name.trim().toLowerCase()===myName.toLowerCase()).id;
        if(partner&&!eks.members.some(m=>m.name.trim().toLowerCase()===partner.toLowerCase()))
          eks.members.push({id:nid("m"),name:partner});
        if(phone)eks.phone=phone;
        if(!s.founderId){s.founderId=newId;forst=true;}
        return;
      }
      const voksne=[meg];
      if(partner)voksne.push({id:nid("m"),name:partner});
      s.families.push({id:nid("f"),name:barn.map(k=>k.name).join(" og "),active:true,phone,kids:barn,members:voksne});
      if(!s.founderId){s.founderId=newId;forst=true;}   // den f\u00f8rste som legger seg til, styrer gruppa
      const nvn=barn.map(k=>k.name).join(" og ");
      if(forst)generer(s);
      else regenFuture(s,nvn+" er med i rulleringen fra "+kort(ledeDato()),ledeDato());
    });
    if(LOADERR)return;                                   // ingenting ble lagret, ikke l\u00e5s oss til en id som ikke finnes
    TAB="hjem";
    await setMe(newId);
    toast(blePart?"Du er lagt til som voksen hos "+barn.map(k=>k.name).join(" og ")
      :forst?"Gruppa er opprettet. Del lenken med de andre."
      :"Velkommen. Du er med i rulleringen fra "+kort(ledeDato())+", så de neste ukene står urørt.");return;}
  if(a==="activateoff"){
    const fid=myFam().id, grense=ledeDato();
    let ute=0;
    await mutate(s=>{const f=s.families.find(x=>x.id===fid);if(!f)return;
      f.active=false;
      /* De nærmeste dagene skyves ikke over på andre bak deres rygg, de legges ut for bytte. */
      skoledager().filter(dt=>dt>=today()&&dt<grense).forEach(dt=>{
        ((s.plan[dt]||{}).slots||[]).forEach(sl=>{
          if(sl.familyId===fid){sl.original=sl.original||fid;sl.familyId=null;ute++;}});
      });
      regenFuture(s,husnavn(f)+" ble meldt av, og har "+ute+" dager ute for bytte",grense);});
    toast(ute?"Meldt av. "+ute+" dager før "+kort(grense)+" ligger nå ute for bytte."
      :"Meldt av. Dagene fra "+kort(grense)+" er fordelt på de andre.");return;}
  if(a==="activateon"){
    const fid=myFam().id;
    await mutate(s=>{const f=s.families.find(x=>x.id===fid);if(!f)return;f.active=true;
      regenFuture(s,husnavn(f)+" ble meldt på igjen, med fra "+kort(ledeDato()),ledeDato());});
    toast("Velkommen tilbake, med fra "+kort(ledeDato())+".");return;}
  if(a==="savecontact"){
    const fid=myFam().id;
    const phone=document.getElementById("famphone").value.trim();
    const kidsRaw=document.getElementById("famkids").value;
    const prevKids=myFam().kids||[];
    const kids=parseKids(kidsRaw,prevKids);
    const tlf={};
    (myFam().members||[]).forEach(m=>{const el=document.getElementById("tlf-"+m.id);
      if(el)tlf[m.id]=el.value.trim();});
    await mutate(s=>{const ff=s.families.find(x=>x.id===fid);if(!ff)return;
      ff.phone=phone;ff.kids=kids;if(kids.length)ff.name=kids.map(k=>k.name).join(" og ");
      ff.members.forEach(m=>{if(tlf[m.id]!==undefined){if(tlf[m.id])m.phone=tlf[m.id];else delete m.phone;}});});
    toast("Lagret");return;}
  if(a==="saveterm"){
    const start=document.getElementById("ts").value, end=document.getElementById("te").value;
    const meetTime=document.getElementById("mt").value||"08:15";
    const pdEl=document.getElementById("pd");
    const perDay=Math.max(1,Math.min(4,parseInt(pdEl?pdEl.value:"1",10)||1));
    if(!start||!end||start>end){toast("Sjekk datoene");return;}
    const skip=parseSkip(document.getElementById("skip").value);
    const gml=DATA.term;
    /* Bare disse fire påvirker hvilke dager som finnes. Endres de ikke, står planen urørt. */
    const planEndres=gml.start!==start||gml.end!==end||(gml.perDay||1)!==perDay||
      JSON.stringify(gml.skip||[])!==JSON.stringify(skip);
    if(planEndres&&!b.dataset.sure){
      b.dataset.sure="1";b.textContent="Dette fordeler dagene på nytt. Trykk igjen";return;}
    await mutate(s=>{
      Object.assign(s.term,{start,end,meetTime,perDay,skip});
      if(planEndres)regenFuture(s,"Terminen ble endret, og dagene fordelt på nytt");
    });
    toast(planEndres?"Terminen er lagret, og dagene fordelt på nytt"
      :"Terminen er lagret. Dagene står som de var.");return;}
  if(a==="savebane"){
    const g=id=>{const el=document.getElementById(id);return el?el.value.trim():"";};
    const tall=(id,std)=>{const n=parseInt(g(id),10);return isNaN(n)?std:Math.max(1,Math.min(120,n));};
    const baneFra=/^\d{1,2}:\d{2}$/.test(g("bfra"))?g("bfra"):DATA.term.baneFra;
    const baneTil=/^\d{1,2}:\d{2}$/.test(g("btil"))?g("btil"):DATA.term.baneTil;
    await mutate(s=>{Object.assign(s.term,{baneFra,baneTil,baneIntervall:tall("bint",8),
      reisetid:tall("reise",12)});});
    toast("Banen er lagret. Dagene står som de var.");return;}
  if(a==="hday"){HDAY=add(HDAY||today(),+b.dataset.v);HFASE=null;render();return;}
  if(a==="hfase"){HFASE=b.dataset.f;render();window.scrollTo(0,0);return;}
  if(a==="detErMeg"){
    const dt=b.dataset.d, hid=b.dataset.h, f=myFam();
    if(!f||f.id!==hid){toast("Du kan bare si dette for din egen husstand");return;}
    const nm=meName();
    await mutate(s=>{const d=iDag(s,dt);d.vakt[hid]=ME;dagLogg(s,dt,nm+" går i dag");});
    toast("Du står som den som går");return;}
  if(a==="bane"){
    const dt=b.dataset.d, tid=b.dataset.t;
    if(!kanKrysse(dt)){toast("Det er de på vakt som setter banetid");return;}
    const nm=meName();
    await mutate(s=>{const d=iDag(s,dt);
      if(tid){d.bane=tid;dagLogg(s,dt,nm+" satte banen til "+tid);}
      else{delete d.bane;dagLogg(s,dt,nm+" fjernet banetiden");}});
    toast(tid?"Banen er satt til "+tid+", hjemme "+ankomst(tid):"Banetiden er fjernet");return;}
  if(a==="pm"){
    const dt=b.dataset.d, kid=b.dataset.k;
    if(!kanKrysse(dt)){toast("Det er de på vakt som krysser av");return;}
    const navn=(alleBarn().find(k=>k.id===kid)||{}).name||"Barnet";
    let av=false;
    await mutate(s=>{const d=iDag(s,dt);const bs=d.barn[kid]=d.barn[kid]||{};
      if(bs.pm==="hentet"){delete bs.pm;}else{bs.pm="hentet";av=true;}
      dagLogg(s,dt,navn+(av?" er hentet":" er ikke hentet likevel"));});
    return;}
  if(a==="meldav"){
    const dt=b.dataset.d, kid=b.dataset.k, felt=b.dataset.felt;
    if(!erMinBarn(kid)&&!kanKrysse(dt)){toast("Du kan bare melde av dine egne barn");return;}
    const navn=(alleBarn().find(k=>k.id===kid)||{}).name||"Barnet";
    const nm=meName();
    let tekst="";
    await mutate(s=>{const d=iDag(s,dt);const bs=d.barn[kid]=d.barn[kid]||{};
      if(felt==="begge"){
        bs.am="ikke";bs.pm="ikke";tekst=navn+" er borte hele dagen";
      }else if(felt==="am"){
        if(bs.am==="ikke"){delete bs.am;tekst=navn+" blir med om morgenen igjen";}
        else{bs.am="ikke";tekst=navn+" er ikke med om morgenen";}
      }else{
        if(bs.pm==="ikke"){delete bs.pm;tekst=navn+" skal hentes igjen";}
        else{bs.pm="ikke";tekst=navn+" skal ikke hentes";}
      }
      dagLogg(s,dt,tekst+" ("+nm+")");});
    toast(tekst);return;}
  if(a==="motteikke"){
    const dt=b.dataset.d, kid=b.dataset.k;
    if(!kanKrysse(dt)){toast("Det er de på vakt som teller barna");return;}
    const navn=(alleBarn().find(k=>k.id===kid)||{}).name||"Barnet";
    let av=false;
    await mutate(s=>{const d=iDag(s,dt);const bs=d.barn[kid]=d.barn[kid]||{};
      if(bs.am==="motteikke"){delete bs.am;dagLogg(s,dt,navn+" kom likevel");}
      else{bs.am="motteikke";av=true;dagLogg(s,dt,navn+" møtte ikke opp");}
      if(!Object.keys(bs).length)delete d.barn[kid];});
    toast(av?navn+" er ikke med":navn+" er med igjen");return;}
  if(a==="notat"){
    const dt=b.dataset.d, kid=b.dataset.k;
    if(!erMinBarn(kid)&&!kanKrysse(dt)){toast("Du kan bare skrive beskjed for dine egne barn");return;}
    const el=document.getElementById("notat-"+kid);
    const txt=el?el.value.trim():"";
    const navn=(alleBarn().find(k=>k.id===kid)||{}).name||"Barnet";
    await mutate(s=>{const d=iDag(s,dt);const bs=d.barn[kid]=d.barn[kid]||{};
      if(txt){bs.notat=txt;dagLogg(s,dt,"Beskjed om "+navn+": "+txt);}
      else{delete bs.notat;dagLogg(s,dt,"Beskjeden om "+navn+" er fjernet");}});
    toast(txt?"Beskjeden er lagret":"Beskjeden er fjernet");return;}
  if(a==="ics"){const dt=b.dataset.d;
    downloadICS("folgegruppe_"+dt+".ics",[icsEvent(dt,"Følgegruppa: din tur til å levere",icsMed(dt))]);

  if(a==="icsall"){
    const days=skoledager().filter(dt=>dt>=today()&&isMine(dt));
    if(!days.length){toast("Du har ingen dager igjen denne terminen");return;}
    downloadICS("folgegruppe_dine_dager.ics",days.map(dt=>icsEvent(dt,"Følgegruppa: din tur til å levere",icsMed(dt))));
    toast(days.length+" dager lagt i kalenderfilen");return;}
  if(a==="gen"){
    if(!b.dataset.sure){b.dataset.sure="1";b.textContent="Trykk igjen for å bekrefte";return;}
    await mutate(s=>{s.order=[];generer(s);});toast("Dagene er fordelt");return;}
  if(a==="drop"){
    const dt=b.dataset.d;
    const i=b.dataset.i!==undefined?+b.dataset.i:minPlass(dt);
    if(i<0)return;
    await mutate(s=>{const ps=(s.plan[dt]||{}).slots||[];const sl=ps[i];if(!sl||!sl.familyId)return;
      const f=s.families.find(x=>x.id===sl.familyId);
      sl.original=sl.original||sl.familyId;sl.familyId=null;
      s.log.unshift({ts:Date.now(),text:(f?husnavn(f):"Noen")+" vil bytte bort "+lang(dt)});});
    toast("Plassen er lagt ut for bytte. Nå kan andre ta den.");return;}
  if(a==="take"){
    const dt=b.dataset.d, f=myFam();if(!f)return;

    const i=b.dataset.i!==undefined?+b.dataset.i:plasser(dt).findIndex(sl=>!sl.familyId);
    if(i<0)return;
    await mutate(s=>{const ps=(s.plan[dt]||{}).slots||[];const sl=ps[i];if(!sl||sl.familyId)return;
      sl.familyId=f.id;s.log.unshift({ts:Date.now(),text:husnavn(f)+" tar "+lang(dt)});});
    toast("Du står nå oppført "+lang(dt));return;}
});
